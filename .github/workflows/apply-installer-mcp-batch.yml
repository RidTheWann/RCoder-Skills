name: Apply installer MCP batch

on:
  push:
    branches:
      - fix/installer-mcp-setup-batch

permissions:
  contents: write

jobs:
  apply-batch:
    if: github.repository == 'RidTheWann/RCoder-Skills' && github.ref == 'refs/heads/fix/installer-mcp-setup-batch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout batch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/installer-mcp-setup-batch
          fetch-depth: 0

      - name: Reconstruct and verify exact patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, re, subprocess
          from pathlib import Path

          expected_patch_sha256 = "e753695ee56e422ba894bfdcdd396c58f54a32232e712feccf9ff653dedc6bf9"
          chunk_dir = Path("tmp")
          chunks = sorted(chunk_dir.glob("rcoder-patch.*"))
          expected_names = [f"rcoder-patch.{index:02d}" for index in range(13)]
          assert [item.name for item in chunks] == expected_names, "missing or reordered patch chunks"
          encoded = "".join(item.read_text(encoding="ascii").strip() for item in chunks)
          packed = base64.b64decode(encoded, validate=True)
          patch = gzip.decompress(packed)
          actual_sha = hashlib.sha256(patch).hexdigest()
          assert actual_sha == expected_patch_sha256, f"patch SHA mismatch: {actual_sha}"
          allowlist = {
              ".github/workflows/quality.yml", "CHANGELOG.md", "README.md", "docs/MCP.md",
              "install.ps1", "launcher/McpSetup.ps1", "launcher/RCoder.ps1", "package.json",
              "scripts/install.ps1", "scripts/install.sh", "scripts/rcoder.mjs",
              "scripts/test-installer-menus.py", "scripts/test-installers.ps1",
              "scripts/test-installers.sh", "scripts/test-mcp-setup.py",
              "scripts/test-node-installer.mjs", "scripts/validate-all",
              "skills/rcoder/scripts/rcoder_mcp_setup.py",
          }
          pairs = re.findall(rb"(?m)^diff --git a/(.*?) b/(.*?)$", patch)
          paths = {left.decode("utf-8") for left, right in pairs}
          assert len(pairs) == len(allowlist) and all(left == right for left, right in pairs), "patch has duplicate or renamed paths"
          assert paths == allowlist, f"unexpected paths: {sorted(paths ^ allowlist)}"
          patch_path = Path("/tmp/rcoder-installer-mcp-fix.patch")
          patch_path.write_bytes(patch)
          subprocess.run(["git", "apply", "--check", "--index", str(patch_path)], check=True)
          subprocess.run(["git", "apply", "--index", str(patch_path)], check=True)

          # Verify every resulting Git blob against the exact new object ID recorded in the patch.
          expected_blobs = {}
          for block in re.split(rb"(?m)(?=^diff --git )", patch):
              match = re.search(rb"(?m)^diff --git a/(.*?) b/.*$", block)
              index = re.search(rb"(?m)^index [0-9a-f]+\.\.([0-9a-f]{40})", block)
              if match and index:
                  expected_blobs[match.group(1).decode("utf-8")] = index.group(1).decode("ascii")
          assert set(expected_blobs) == allowlist, "not all expected blob IDs are present"
          for path, expected in expected_blobs.items():
              actual = subprocess.check_output(["git", "hash-object", path], text=True).strip()
              assert actual == expected, f"blob mismatch for {path}: {actual} != {expected}"

          staged = set(subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines())
          assert staged == allowlist, f"staged paths mismatch: {sorted(staged ^ allowlist)}"

          # Remove this one-shot updater and its transport payload from the branch.
          subprocess.run(["git", "rm", "-f", ".github/workflows/apply-installer-mcp-batch.yml"], check=True)
          subprocess.run(["git", "rm", "-r", "-f", "tmp"], check=True)
          subprocess.run(["git", "add", "-u"], check=True)
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "commit", "-m", "fix(installer): integrate MCP setup and repair bootstrap paths"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:refs/heads/fix/installer-mcp-setup-batch"], check=True)
          PY
