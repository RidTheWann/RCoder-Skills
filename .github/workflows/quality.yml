name: RCoder quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Static validation
        run: python scripts/validate-all
      - name: Context snapshot regression
        run: python scripts/test-context-snapshot.py
      - name: Evaluation scorer self-test
        run: python scripts/test-score-eval.py
      - name: Deterministic objective verifier self-test
        run: python scripts/test-objective.py
      - name: CI registration meta-check
        shell: bash
        run: python -c "from pathlib import Path; wf=Path('.github/workflows/quality.yml').read_text(); missing=[p.name for p in Path('scripts').glob('test-*') if p.name not in wf]; assert not missing, missing"
      - name: Objective checks on the frozen control (informational)
        shell: bash
        run: python scripts/verify-objective.py --predictions evals/runs/hy4-flash-openrouter-2026-11-19/WITH.jsonl --output "$RUNNER_TEMP/control-objective.jsonl" --definitions "$RUNNER_TEMP/control-objective-definitions.json"
      - name: Judge helper self-test (offline, no live model)
        run: python scripts/test-score-scenarios.py
      - name: Tool discovery and bounded fallback self-test
        run: python scripts/test-tool-probe.py
      - name: RSaver context-reduction tests
        run: python scripts/test-rsaver.py
      - name: RScan reconnaissance and hook tests
        run: python scripts/test-rscan.py
      - name: MCP server protocol and confinement tests
        run: python scripts/test-mcp.py
      - name: Shared MCP contract and pagination conformance
        run: python scripts/test-mcp-contract.py
      - name: MCP Streamable HTTP transport conformance
        run: python scripts/test-mcp-http.py
      - name: RCoder CLI doctor
        run: node scripts/test-cli-doctor.mjs
      - name: Modern MCP entry point (stateless protocol, Skills over MCP)
        run: python scripts/test-mcp-modern.py
      - name: MCP installer helper (safe config merge, snippets, self-test)
        run: python scripts/test-mcp-setup.py
      - name: Interactive installer menus (no duplicate option numbers)
        run: python scripts/test-installer-menus.py
      - name: MCP server syntax and host configuration snippets
        shell: bash
        run: |
          python -m py_compile skills/rcoder/scripts/rcoder_mcp.py skills/rcoder/scripts/rcoder_mcp_modern.py skills/rcoder/scripts/rcoder_mcp_http.py skills/rcoder/scripts/rcoder_mcp_setup.py skills/rcoder/scripts/rcoder_contract.py
          python scripts/rcoder-mcp.py --print-config generic > "$RUNNER_TEMP/mcp-generic.json"
          python skills/rcoder/scripts/rcoder_mcp_modern.py --print-config generic > "$RUNNER_TEMP/mcp-modern.json"
          python -c "import json,sys; json.load(open(sys.argv[1]))" "$RUNNER_TEMP/mcp-modern.json"
          python -c "import json,sys; json.load(open(sys.argv[1]))" "$RUNNER_TEMP/mcp-generic.json"
      - name: Benchmark harness syntax check
        run: python -m py_compile scripts/run-benchmark.py
      - name: RScan OpenCode adapter syntax checks
        shell: bash
        run: |
          python scripts/rscan.py hooks adapter --host opencode --api v1 --scope project --root . --dry-run > "$RUNNER_TEMP/rscan-v1.js"
          node --check "$RUNNER_TEMP/rscan-v1.js"
          python scripts/rscan.py hooks adapter --host opencode --api v2 --scope project --root . --dry-run > "$RUNNER_TEMP/rscan-v2.js"
          node --check "$RUNNER_TEMP/rscan-v2.js"
      - name: Node syntax check
        run: node --check scripts/rcoder.mjs
      - name: Node installer and terminal launcher simulations
        run: node scripts/test-node-installer.mjs
      - name: Verify npm package contents
        run: npm pack --dry-run --json
      - name: POSIX installer simulations
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/test-installers.sh
      - name: Windows PowerShell 5.1 parser and installer simulations
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-installers.ps1
      - name: PowerShell 7 parser and installer simulations
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-installers.ps1
      - name: Build reproducible packages
        run: python scripts/package
      - name: Verify package checksums
        run: python scripts/check-dist.py
