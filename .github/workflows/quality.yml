name: RCoder quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Static validation
        run: python scripts/validate-all
      - name: Context snapshot regression
        run: python scripts/test-context-snapshot.py
      - name: Evaluation scorer self-test
        run: python scripts/test-score-eval.py
      - name: RSaver context-reduction tests
        run: python scripts/test-rsaver.py
      - name: Node syntax check
        run: node --check scripts/rcoder.mjs
      - name: Node installer and terminal launcher simulations
        run: node scripts/test-node-installer.mjs
      - name: Verify npm package contents
        run: npm pack --dry-run --json
      - name: POSIX installer simulations
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/test-installers.sh
      - name: Windows PowerShell 5.1 parser and installer simulations
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-installers.ps1
      - name: PowerShell 7 parser and installer simulations
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-installers.ps1
      - name: Build reproducible packages
        run: python scripts/package
